name: Bump jobhound formula

# Thin caller: wires jobhound's release triggers to the reusable bump.yaml.
# See bump.yaml for the mechanics (cooldown flag, tap symlink, PR open).

on:
  repository_dispatch:
    types: [bump-jobhound]
  workflow_dispatch:
    inputs:
      version:
        description: "jobhound version to bump to (blank = latest on PyPI)"
        required: false
        type: string

permissions: {}

jobs:
  bump:
    permissions:
      contents: read
    uses: ./.github/workflows/bump.yaml
    secrets:
      SEMANTIC_RELEASE_APP_CLIENT_ID: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
      SEMANTIC_RELEASE_APP_PRIVATE_KEY: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
    with:
      formula: jobhound
      version: ${{ github.event.client_payload.version || github.event.inputs.version }}
      # jobhound installs the [mcp] extra; cffi/cryptography/pycparser (brewed
      # cryptography), pydantic/pydantic-core (brewed pydantic), and rpds-py
      # (brewed rpds-py) are provided via depends_on and must NOT be vendored as
      # resources (that would drag a Rust toolchain in). The cooldown flag
      # preserves the [mcp] extra on the direct-URL reference, so the extra's own
      # resources still resolve.
      package-name: jobhound[mcp]
      exclude-packages: cffi,cryptography,pycparser,pydantic,pydantic-core,rpds-py
