name: publish bottles

# Publishes the bottles test-bot built for a bump/* PR, then lands the bottled
# formula on main.
#
# This does NOT use `brew pr-pull`: pr-pull finds and downloads the CI artifacts
# via `GitHub.get_workflow_run`, which requires a token presenting the classic
# `repo` OAuth scope. Our fine-grained App token (and GITHUB_TOKEN) report no
# classic scopes, so pr-pull rejects them. Instead we download the artifacts
# ourselves with `gh run download` (App token, actions:read) and hand them to
# `brew pr-upload`, which merges the bottle DSL into the formula and uploads the
# bottles to a GitHub Release via GitHubReleases — no scope-gated call.

on:
  workflow_run:
    # zizmor: ignore[dangerous-triggers]
    # Safe: this job only runs for same-repo bump/* branches (see the job's
    # `if:` guard), which only the SEMANTIC_RELEASE_APP creates. Fork PRs fail
    # the head_repository check and can never reach the write-capable App token.
    workflows: ["brew test-bot"]
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'bump/')
    permissions:
      contents: read
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # actions:read lets `gh run download` fetch test-bot's bottle artifacts.
          permission-actions: read

      # Check out the exact commit test-bot went green on, so the bottle block is
      # added to the reviewed/tested formula and nothing newer sneaks onto main.
      # This runs BEFORE Set up Homebrew / Set up git: those configure a global
      # git Authorization header, and actions/checkout adds its own — two
      # Authorization headers make GitHub reject the fetch ("Duplicate header").
      - name: Check out the tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91  # master @ 2026-05-22
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91  # master @ 2026-05-22

      - name: Merge bottles and upload to the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          # brew bottle --merge loads the formula, tripping Homebrew's tap-trust
          # gate (test-bot auto-trusts the tap it tests; this job does not). Our
          # own first-party tap, so the gate adds nothing here.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euxo pipefail
          version="${HEAD_BRANCH#bump/jobhound-}"

          # setup-homebrew symlinked yo61/tap to this workspace AND hard-reset it
          # to main (0.16.0). Restore the exact commit test-bot bottled so brew
          # edits the 0.17.0 formula, not the 0.16.0 on main. The object is
          # already present from the earlier checkout; fetch it as a fallback.
          cd "$GITHUB_WORKSPACE"
          git checkout --quiet --force "$HEAD_SHA" 2>/dev/null || {
            git fetch --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$HEAD_SHA"
            git checkout --quiet --force "$HEAD_SHA"
          }
          echo "formula at tested commit: $(grep -m1 'jobhound-[0-9]' Formula/jobhound.rb)"

          # Download the bottles test-bot uploaded (App token has actions:read).
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/bottles"

          # pr-upload reads *.bottle.json from the cwd (the tap). It uploads the
          # bottles to the release AND commits the bottle block onto HEAD
          # ("jobhound: add <version> bottle."), so there is nothing to commit
          # ourselves — Push to main pushes that commit.
          find "$RUNNER_TEMP/bottles" -name '*.bottle.*' -exec cp {} . \;
          brew pr-upload --verbose \
            --root-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/jobhound-${version}"
          rm -f ./*.bottle.*

          if ! grep -q "bottle do" Formula/jobhound.rb; then
            echo "::error::no bottle block in formula after pr-upload"
            exit 1
          fi

      # Not Homebrew/actions/git-try-push: it inherits the global http
      # Authorization header setup-homebrew configured AND adds its own, so every
      # pull/push gets "Duplicate header: Authorization" (400) and it retries
      # forever. Push manually: drop that extraheader and auth via the token in
      # the remote URL (as bump-jobhound.yaml does). The App bypasses the
      # protected main branch, so the unsigned bottle commit lands.
      - name: Push to main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Override (empty), not unset, setup-homebrew's global http
          # Authorization header for just these commands: the token in the URL is
          # the single Authorization, so no "Duplicate header" 400. Overriding
          # per-command (rather than unsetting globally) leaves the config for
          # setup-homebrew's post-cleanup, which otherwise fails.
          hdr='http.https://github.com/.extraheader='
          # main has advanced past the bump commit's base; replay the bump +
          # bottle commit onto current main (formula is untouched on main, so no
          # conflict), then fast-forward push.
          git -c "$hdr" fetch --quiet "$url" main
          git rebase FETCH_HEAD
          git -c "$hdr" push "$url" HEAD:main

      - name: Close the bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Pushing the rebased bottle commit usually content-merges the bump PR
          # (GitHub marks it merged and deletes the branch). Only act if it is
          # somehow still open.
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" \
                 --state open --json number --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Bottled and landed on main via publish-bottles."
          else
            echo "bump PR already merged/closed by the push; nothing to do"
          fi
