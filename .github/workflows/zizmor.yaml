name: zizmor

# zizmor only analyses workflow/action definitions, so only run when one
# changes. The tap's routine traffic — formula bumps and the bottle commits
# publish-bottles.yaml pushes to main — never touches .github, so an unfiltered
# trigger just re-scans an unchanged directory to the same result. Safe to skip:
# main's ruleset requires no status checks, and the publish pipeline gates on
# the brew test-bot workflow_run, not on zizmor.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa  # v0.5.7
        with:
          advanced-security: false
          persona: regular
          version: v1.26.1
