name: Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: brew audit + install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Need history to diff against the PR base / previous main tip in
          # "Find changed formulas and casks" below.
          fetch-depth: 0
          # No git writes happen in this job; don't leave a token on disk.
          persist-credentials: false

      # Run the diff before installing Homebrew so PRs that don't touch a
      # Casks/*.rb or Formula/*.rb file skip the ~20s `Set up Homebrew`
      # bootstrap entirely. Only `Find changed` and `actions/checkout`
      # run on the fast-skip path.
      - name: Find changed formulas and casks
        id: artifacts
        env:
          # Both SHA values come from GitHub-computed event payload (not
          # user-supplied), but bind via env: + shell expansion anyway to
          # match the workflow-hardening pattern used by bump-jobhound.yml.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Determine the base commit to diff against.
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE_SHA" ;;
            *)            base="" ;;
          esac

          # If we can't resolve the base (first push to a branch, force-push
          # without fetch-depth, unknown event), fall back to auditing
          # everything — better noisy than silently skipping work.
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "Base commit not resolvable ('$base'); auditing all artifacts."
            files="$(find Casks Formula -name '*.rb' -print 2>/dev/null || true)"
          else
            # Diff only files under Casks/ or Formula/ ending in .rb.
            # `git diff --diff-filter=d` excludes deletions so we don't try
            # to install a formula whose source has been removed.
            files="$(git diff --name-only --diff-filter=d "$base" HEAD -- 'Casks/*.rb' 'Formula/*.rb' || true)"
            if [ -n "$files" ]; then
              echo "Changed since $base:"
              # Indent each line two spaces (bash param expansion, not sed: SC2001).
              echo "  ${files//$'\n'/$'\n'  }"
            fi
          fi

          if [ -z "$files" ]; then
            echo "No formula or cask changes — skipping audit/install/test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Homebrew
        if: steps.artifacts.outputs.skip != 'true'
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91  # master @ 2026-05-28

      - name: Tap this checkout as yo61/tap
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          set -euxo pipefail
          tap_dir="$(brew --repository)/Library/Taps/yo61/homebrew-tap"
          # Homebrew/actions/setup-homebrew@main pre-creates an empty
          # placeholder dir at $tap_dir; replace it with a symlink to this
          # checkout. The post-step cleanup uses plain `rm` (not -rf), which
          # only works on a symlink — so we must not turn $tap_dir into a
          # real directory (e.g. via `brew tap <name> <path>`, which clones).
          rm -rf "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: brew audit --strict --new
        if: steps.artifacts.outputs.skip != 'true'
        env:
          FILES: ${{ steps.artifacts.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            name="$(basename "$path" .rb)"
            echo "::group::audit yo61/tap/$name"
            brew audit --strict --new "yo61/tap/$name"
            echo "::endgroup::"
          done <<< "$FILES"

      # Disable Homebrew's Linux install sandbox. The sandbox requires
      # rootless bubblewrap + unprivileged user namespaces; Ubuntu 24.04
      # (ubuntu-latest) blocks the namespaces by default via AppArmor.
      # See bump-jobhound.yml for the same fix applied there.
      - name: brew install (+ brew test for formulas)
        if: steps.artifacts.outputs.skip != 'true'
        env:
          HOMEBREW_NO_SANDBOX_LINUX: "1"
          FILES: ${{ steps.artifacts.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            name="$(basename "$path" .rb)"
            kind="$(dirname "$path")"   # "Casks" or "Formula"
            echo "::group::install $kind/$name"
            brew install --verbose "yo61/tap/$name"
            echo "::endgroup::"
            # `brew test` only applies to formulas. For casks, the cask's
            # `brew audit --strict --new` already validates the metadata,
            # and the install above proves the artifact is fetchable and
            # placeable. There's no equivalent inline test block for casks.
            if [ "$kind" = "Formula" ]; then
              echo "::group::test Formula/$name"
              brew test "yo61/tap/$name"
              echo "::endgroup::"
            fi
          done <<< "$FILES"
