name: Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: brew audit + install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap this checkout as yo61/tap
        run: |
          set -euxo pipefail
          tap_dir="$(brew --repository)/Library/Taps/yo61/homebrew-tap"
          # Homebrew/actions/setup-homebrew@main pre-creates an empty
          # placeholder dir at $tap_dir; replace it with a symlink to this
          # checkout. The post-step cleanup uses plain `rm` (not -rf), which
          # only works on a symlink — so we must not turn $tap_dir into a
          # real directory (e.g. via `brew tap <name> <path>`, which clones).
          rm -rf "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Find formulas and casks
        id: artifacts
        run: |
          set -euo pipefail
          files="$(find Casks Formula -name '*.rb' -print 2>/dev/null || true)"
          if [ -z "$files" ]; then
            echo "No formulas or casks yet — skipping audit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: brew audit --strict --new
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            name="$(basename "$path" .rb)"
            echo "::group::audit yo61/tap/$name"
            brew audit --strict --new "yo61/tap/$name"
            echo "::endgroup::"
          done <<< "${{ steps.artifacts.outputs.files }}"

      - name: brew install (+ brew test for formulas)
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            name="$(basename "$path" .rb)"
            kind="$(dirname "$path")"   # "Casks" or "Formula"
            echo "::group::install $kind/$name"
            brew install --verbose "yo61/tap/$name"
            echo "::endgroup::"
            # `brew test` only applies to formulas. For casks, the cask's
            # `brew audit --strict --new` already validates the metadata,
            # and the install above proves the artifact is fetchable and
            # placeable. There's no equivalent inline test block for casks.
            if [ "$kind" = "Formula" ]; then
              echo "::group::test Formula/$name"
              brew test "yo61/tap/$name"
              echo "::endgroup::"
            fi
          done <<< "${{ steps.artifacts.outputs.files }}"
