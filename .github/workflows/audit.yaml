name: Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: brew audit + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap this checkout as yo61/tap
        run: |
          set -euxo pipefail
          tap_dir="$(brew --repository)/Library/Taps/yo61/homebrew-tap"
          rm -rf "$tap_dir"
          # `brew tap` with an explicit path treats this checkout as the tap.
          brew tap yo61/tap "$GITHUB_WORKSPACE"
          brew tap

      - name: Find formulas
        id: formulas
        run: |
          set -euo pipefail
          formulas="$(find Formula -name '*.rb' -print 2>/dev/null || true)"
          if [ -z "$formulas" ]; then
            echo "No formulas in Formula/ yet — skipping audit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            names="$(echo "$formulas" | xargs -n1 basename | sed 's/\.rb$//')"
            {
              echo "names<<EOF"
              echo "$names"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: brew audit --strict --new
        if: steps.formulas.outputs.skip != 'true'
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            echo "::group::audit yo61/tap/$name"
            brew audit --strict --new "yo61/tap/$name"
            echo "::endgroup::"
          done <<< "${{ steps.formulas.outputs.names }}"

      - name: brew install + brew test
        if: steps.formulas.outputs.skip != 'true'
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            echo "::group::install + test yo61/tap/$name"
            brew install --verbose "yo61/tap/$name"
            brew test "yo61/tap/$name"
            echo "::endgroup::"
          done <<< "${{ steps.formulas.outputs.names }}"
