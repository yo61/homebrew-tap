name: brew test-bot

on:
  push:
    branches:
      - main
    paths:
      - Formula/**
      - Casks/**
  pull_request:
    paths:
      - Formula/**
      - Casks/**

permissions:
  contents: read

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # No macos-15-intel: jobhound's deps (cryptography/pydantic/rpds-py)
        # have no Intel-Sequoia bottle in homebrew/core, so jobhound can't be
        # bottled there — the job would only ever warn "No bottle built".
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      # The Linux job runs in a container where bubblewrap's sandbox probe
      # can't get the namespaces it needs; Homebrew warns and builds unsandboxed
      # anyway. Skip the probe (and the noise) — CI runners are ephemeral.
      HOMEBREW_NO_SANDBOX: "1"
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@6eaeff80e7e5c43087c0e5eb5aa82120399e9c91  # master @ 2026-05-22
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Cleanup before
        run: brew test-bot --only-cleanup-before

      - name: Setup
        run: brew test-bot --only-setup

      - name: Tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Build bottle
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
