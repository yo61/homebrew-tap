name: Bump unifictl formula

# Thin caller: wires unifictl's release triggers to the reusable bump.yaml.
# See bump.yaml for the mechanics (cooldown flag, tap symlink, PR open).

on:
  repository_dispatch:
    types: [bump-unifictl]
  workflow_dispatch:
    inputs:
      version:
        description: "unifictl version to bump to (blank = latest on PyPI)"
        required: false
        type: string

permissions: {}

jobs:
  bump:
    permissions:
      contents: read
    uses: ./.github/workflows/bump.yaml
    secrets:
      SEMANTIC_RELEASE_APP_CLIENT_ID: ${{ secrets.SEMANTIC_RELEASE_APP_CLIENT_ID }}
      SEMANTIC_RELEASE_APP_PRIVATE_KEY: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
    with:
      formula: unifictl
      version: ${{ github.event.client_payload.version || github.event.inputs.version }}
      # unifictl is pure Python with no compiled dependencies, so every resource
      # is vendored — no package-name extra and no exclude-packages (contrast
      # bump-jobhound.yaml). The cooldown flag exempts unifictl's just-published
      # release; its dependencies stay cooled.
