name: Commit recipe and open PR
description: >-
  Create the given branch at main's HEAD, commit the listed workspace files as a
  single GitHub-signed GraphQL commit, and open a PR. The signed commit lets the
  downstream publish workflow squash-merge onto signature-protected main with no
  ruleset bypass. The Contents REST API does not sign — only createCommitOnBranch
  and the web UI do.

inputs:
  file-paths:
    description: >-
      Space- or newline-separated files to commit, e.g. Formula/unifictl.rb, or
      several paths for a style sweep. Each listed file must differ from main or
      the action fails closed, so a caller that silently produced no edit gets an
      error instead of an empty PR.
    required: true
  branch:
    description: Branch to create and open the PR from (e.g. bump/unifictl-0.4.0 or cask/go-udap-2.4.5)
    required: true
  token:
    description: App token with contents:write and pull-requests:write
    required: true
  commit-headline:
    description: Commit message headline
    required: true
  pr-title:
    description: Pull request title
    required: true
  pr-body:
    description: Pull request body
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        FILE_PATHS: ${{ inputs.file-paths }}
        BRANCH: ${{ inputs.branch }}
        HEADLINE: ${{ inputs.commit-headline }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
      run: |
        set -euo pipefail
        mapfile -t paths < <(printf '%s\n' "$FILE_PATHS" | tr ' ' '\n' | sed '/^$/d')
        if [[ ${#paths[@]} -eq 0 ]]; then
          echo "::error::file-paths is empty; nothing to commit"
          exit 1
        fi
        for path in "${paths[@]}"; do
          if git diff --quiet -- "$path"; then
            echo "::error::$path unchanged; nothing to commit"
            exit 1
          fi
        done
        # Create the commit through GitHub's GraphQL createCommitOnBranch:
        # GitHub builds and signs the commit server-side (committer "GitHub",
        # verified), so the PR carries no "commits must have verified signatures"
        # block and the publish workflow can squash-merge it onto the signature-
        # protected main with no ruleset bypass. The Contents REST API does not
        # sign — only createCommitOnBranch and the web UI do.
        base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
        # createCommitOnBranch commits onto an existing branch, so create it
        # (at main's HEAD) first; the mutation then adds the one commit.
        gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
          -f ref="refs/heads/${BRANCH}" -f sha="$base_sha" >/dev/null
        # One mutation carries every file, so a multi-file sweep lands as a
        # single commit rather than one commit (and one push) per path.
        additions=$(
          for path in "${paths[@]}"; do
            jq -nc --arg path "$path" --arg contents "$(base64 -w0 "$path")" \
              '{path: $path, contents: $contents}'
          done | jq -sc .
        )
        jq -nc \
          --arg repo "$GITHUB_REPOSITORY" \
          --arg branch "$BRANCH" \
          --arg oid "$base_sha" \
          --arg headline "$HEADLINE" \
          --argjson additions "$additions" \
          '{query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
            variables:{input:{
              branch:{repositoryNameWithOwner:$repo,branchName:$branch},
              message:{headline:$headline},
              expectedHeadOid:$oid,
              fileChanges:{additions:$additions}}}}' \
          | gh api graphql --input - >/dev/null
        gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
          -f title="$PR_TITLE" \
          -f head="${BRANCH}" \
          -f base=main \
          -f body="$PR_BODY" >/dev/null
