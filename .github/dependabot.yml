# Dependabot keeps the action SHAs. Renovate (renovate.json5) keeps the runner image and the
# annotated *_VERSION values in the workflows. Formula and cask versions are moved by the bump
# workflows; talhelper is frozen by hand (README.md). Each pin has one owner.

version: 2
updates:
  # GitHub Actions. Pins are SHAs with version comments; Dependabot
  # rewrites both. Majors stay outside the group so they arrive singly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
