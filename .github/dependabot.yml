version: 2
updates:
  # GitHub Actions. Pins are SHAs with version comments; Dependabot
  # rewrites both. Majors stay outside the group so they arrive singly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
